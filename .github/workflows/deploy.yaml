name: Deploy

on:
  push:
    branches:
      - main

env:
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/credentials.json

jobs:
  check-config:
    name: Check deploy secrets/vars
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets and vars are set
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && \
             [ -n "$VITE_FIREBASE_API_KEY" ] && \
             [ -n "$VITE_FIREBASE_AUTH_DOMAIN" ] && \
             [ -n "$VITE_FIREBASE_PROJECT_ID" ] && \
             [ -n "$VITE_FIREBASE_APP_ID" ] && \
             [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: one or more required secrets/vars are not set (FIREBASE_SERVICE_ACCOUNT, VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID, FIREBASE_PROJECT_ID)"
          fi

  deploy:
    name: Deploy to Firebase
    needs: check-config
    if: needs.check-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.6.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: pnpm build

      # `packages/backend/dist` is a self-contained package with no
      # `workspace:*` dependencies, so no isolate step is needed here.
      - name: Deploy
        run: pnpm exec firebase deploy --non-interactive --project "${{ vars.FIREBASE_PROJECT_ID }}"
